<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1240" height="500" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1239" height="499" rx="16" fill="none" stroke="#30363d"/>

  <!-- Mac -->
  <rect x="40" y="150" width="210" height="150" rx="14" fill="#161b22" stroke="#30363d" filter="url(#sh)"/>
  <text x="145" y="182" fill="#8b949e" font-size="12" letter-spacing="1.2" text-anchor="middle">YOUR MAC</text>
  <text x="145" y="213" fill="#e6edf3" font-size="15" text-anchor="middle">Claude Desktop</text>
  <text x="145" y="236" fill="#e6edf3" font-size="15" text-anchor="middle">Chrome / Comet</text>
  <text x="145" y="259" fill="#e6edf3" font-size="15" text-anchor="middle">Claude Code</text>
  <text x="145" y="284" fill="#8b949e" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">localhost only</text>

  <line x1="250" y1="225" x2="372" y2="225" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="258" y="196" width="106" height="20" rx="5" fill="#0d1117"/>
  <text x="311" y="211" fill="#8b949e" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">127.0.0.1:2080</text>

  <!-- gateway -->
  <rect x="378" y="180" width="180" height="90" rx="14" fill="#132b4d" stroke="#1f6feb" stroke-width="1.6" filter="url(#sh)"/>
  <text x="468" y="215" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">sing-box</text>
  <text x="468" y="238" fill="#79c0ff" font-size="12.5" text-anchor="middle">gateway · rules</text>

  <!-- branches -->
  <path d="M558 205 C 630 205, 640 140, 696 140" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M558 245 C 630 245, 640 325, 696 325" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="556" y="116" width="128" height="32" rx="6" fill="#0d1117"/>
  <text x="620" y="128" fill="#8b949e" font-size="11.5" text-anchor="middle">Claude domains</text>
  <text x="620" y="144" fill="#8b949e" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">160.79.104.0/21</text>
  <rect x="560" y="288" width="122" height="24" rx="6" fill="#0d1117"/>
  <text x="621" y="304" fill="#8b949e" font-size="11.5" text-anchor="middle">everything else</text>

  <!-- server -->
  <rect x="700" y="95" width="220" height="90" rx="14" fill="#0f2f1d" stroke="#2ea44f" stroke-width="1.6" filter="url(#sh)"/>
  <text x="810" y="127" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Your server</text>
  <text x="810" y="149" fill="#7ee787" font-size="12.5" text-anchor="middle">Singapore</text>
  <text x="810" y="168" fill="#8b949e" font-size="11.5" text-anchor="middle">VLESS+REALITY · SS-2022</text>

  <!-- anthropic -->
  <rect x="985" y="95" width="190" height="90" rx="14" fill="#2b1a12" stroke="#db6d28" stroke-width="1.6" filter="url(#sh)"/>
  <text x="1080" y="129" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Anthropic</text>
  <text x="1080" y="151" fill="#ffa657" font-size="12" text-anchor="middle">sees Singapore only</text>

  <line x1="920" y1="140" x2="980" y2="140" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- vpn -->
  <rect x="700" y="280" width="220" height="90" rx="14" fill="#161b22" stroke="#30363d" filter="url(#sh)"/>
  <text x="810" y="315" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Regular VPN</text>
  <text x="810" y="337" fill="#8b949e" font-size="12.5" text-anchor="middle">or direct internet</text>

  <!-- internet -->
  <rect x="985" y="280" width="190" height="90" rx="14" fill="#161b22" stroke="#30363d" filter="url(#sh)"/>
  <text x="1080" y="317" fill="#8b949e" font-size="14" text-anchor="middle">rest of</text>
  <text x="1080" y="337" fill="#8b949e" font-size="14" text-anchor="middle">the internet</text>

  <line x1="920" y1="325" x2="980" y2="325" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- little snitch -->
  <rect x="430" y="415" width="190" height="50" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="525" y="445" fill="#e6edf3" font-size="14" text-anchor="middle">Little Snitch</text>

  <path d="M620 440 H 940 V 196" fill="none" stroke="#f85149" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="800" y="432" fill="#f85149" font-size="11.5" text-anchor="middle">deny direct connections</text>
  <line x1="930" y1="205" x2="952" y2="183" stroke="#f85149" stroke-width="2.4"/>
  <line x1="952" y1="205" x2="930" y2="183" stroke="#f85149" stroke-width="2.4"/>
  <line x1="985" y1="432" x2="1015" y2="432" stroke="#8b949e" stroke-width="1.6"/>
  <text x="1022" y="436" fill="#8b949e" font-size="11.5">allowed</text>
  <line x1="1085" y1="432" x2="1115" y2="432" stroke="#f85149" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="1122" y="436" fill="#f85149" font-size="11.5">denied</text>
</svg>
